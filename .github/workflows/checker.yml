name: Kamu Ilan Takip Sistemi

on:
  schedule:
    - cron: '0 * * * *' # Her saat başı otomatik çalışır (İstersen sıklaştırabilirsin)
  workflow_dispatch: # Manuel test edebilmek için buton

jobs:
  run-checker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m urllib.request https://bootstrap.pypa.io/get-pip.py -O get-pip.py
          python get-pip.py
          pip install -r requirements.txt

      - name: Run script
        run: python main.py

      - name: Save seen ads state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_ads.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen ads database [skip ci]" && git push)
